[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eprintdl"
version = "1.1.0"
description = "Batch-download IACR Cryptology ePrint Archive papers as original PDFs, via a real browser (CDP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["iacr", "eprint", "cryptology", "preprint", "pdf", "research", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
eprintdl = "eprintdl.cli:main"
eprintdl-mcp = "eprintdl.mcp_server:main"

[project.urls]
Repository = "https://github.com/Jiangjiang-jiang/eprintdl"
Issues = "https://github.com/Jiangjiang-jiang/eprintdl/issues"

[tool.setuptools]
packages = ["eprintdl"]

[tool.setuptools.package-data]
eprintdl = ["py.typed"]
